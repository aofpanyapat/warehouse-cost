<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWOP MART Warehouse Cost</title>
<style>
  html,body{margin:0;min-height:100%;background:#06111f;color:#f4fbff;font-family:system-ui,-apple-system,"Sarabun",sans-serif}
  .boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  .box{max-width:720px;border:1px solid rgba(117,205,255,.25);border-radius:22px;padding:28px;background:#0b1f38;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .spin{width:34px;height:34px;border:4px solid rgba(85,231,255,.18);border-top-color:#55e7ff;border-radius:50%;margin:0 auto 16px;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .muted{color:#a9bdd4;font-size:13px;line-height:1.65}
  .err{color:#ff8a96;white-space:pre-wrap;text-align:left;margin-top:16px;font-family:ui-monospace,Consolas,monospace;font-size:12px}
</style>
</head>
<body>
<div class="boot">
  <div class="box">
    <div class="spin"></div>
    <div style="font-weight:800;font-size:20px">กำลังโหลด SWOP MART Cost Control...</div>
    <div class="muted">GitHub-ready build • Ageing + Volume autosave fix</div>
    <div id="err" class="err"></div>
  </div>
</div>

<script>
(async function(){
  // ใช้ index.html เวอร์ชันล่าสุดที่ยังสมบูรณ์ใน GitHub history เป็นฐาน
  // commit นี้เป็น immutable จึงไม่หายแม้ไฟล์ใน branch main ถูกลบ/แทนที่ภายหลัง
  const BASE_URL = 'https://raw.githubusercontent.com/aofpanyapat/warehouse-cost/7b10c1d6460e804aa909db4d1dd47fefe9de1afe/index.html';

  function mustReplace(src, find, replacement, label){
    const out = typeof find === 'string' ? src.replace(find, replacement) : src.replace(find, replacement);
    if(out === src) throw new Error('Patch ไม่สำเร็จ: ' + label);
    return out;
  }

  function patchApp(src){
    let out = src;

    // ---- 1) Business Rule: เจอ IMEI ใน Withdraw = หยุด Ageing ที่วันที่เบิกครั้งแรกทันที ----
    out = mustReplace(
      out,
`      const withdrawItems = Object.keys(withdrawDates).map(imei=>{
        const dates = withdrawDates[imei].sort();
        const isSingle = dates.length === 1;
        return { imei, withdrawCount: dates.length, removedDate: isSingle ? dates[0] : '' };
      });`,
`      const withdrawItems = Object.keys(withdrawDates).map(imei=>{
        const dates = [...new Set(withdrawDates[imei])].sort();
        // SWOP MART rule: พบ IMEI ใน Withdraw อย่างน้อย 1 ครั้ง = สินค้าออกจากคลัง
        // หยุด Ageing ที่วันที่เบิกครั้งแรกทันที
        return { imei, withdrawCount: dates.length, removedDate: dates.length ? dates[0] : '' };
      });`,
      'Withdraw first-date rule'
    );

    // Precomputed workbook: ถ้ามี Exit_Date ให้หยุด Ageing ตาม Exit_Date โดยไม่สนชื่อ Status
    out = mustReplace(
      out,
`        const removedDate = (status === 'เบิกออกครั้งเดียว') ? normalizeAgeingDate(exitRaw) : '';`,
`        const removedDate = normalizeAgeingDate(exitRaw) || '';`,
      'Precomputed Exit_Date rule'
    );

    // ---- 2) Excel Ageing: ไม่อ่านแค่ sheet แรก ----
    out = mustReplace(
      out,
`        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type:'array', cellDates:true });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        parsedRows = XLSX.utils.sheet_to_json(sheet, { defval:'' });`,
`        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type:'array', cellDates:true });
        const sheetToRows = (sheetName)=>XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval:'' });

        // ลำดับเลือก: Import_เข้าเว็บแอป > ASN_Raw+Withdraw_Raw > sheet ที่ format ตรงอัตโนมัติ
        const importSheet = wb.SheetNames.find(n=>String(n).trim().toLowerCase()==='import_เข้าเว็บแอป');
        const asnSheet = wb.SheetNames.find(n=>String(n).trim().toLowerCase()==='asn_raw');
        const withdrawSheet = wb.SheetNames.find(n=>String(n).trim().toLowerCase()==='withdraw_raw');

        if(importSheet){
          parsedRows = sheetToRows(importSheet);
        } else if(asnSheet && withdrawSheet){
          parsedRows = [...sheetToRows(asnSheet), ...sheetToRows(withdrawSheet)];
        } else {
          parsedRows = [];
          for(const sheetName of wb.SheetNames){
            const rows = sheetToRows(sheetName);
            if(!rows.length) continue;
            const keys = Object.keys(rows[0]||{}).map(k=>String(k).trim().toLowerCase());
            const looksAsnWithdraw = keys.includes('imei') && keys.includes('status') && keys.includes('when');
            const looksPrecomputed = keys.includes('imei') && keys.includes('entry_date');
            const looksWms = keys.includes('imei') && (
              keys.includes('wh received date') ||
              keys.includes('received_date') ||
              keys.includes('receiveddate') ||
              keys.includes('วันที่รับเข้า')
            );
            if(looksAsnWithdraw || looksPrecomputed || looksWms){
              parsedRows = rows;
              break;
            }
          }
          if(!parsedRows.length){
            throw new Error('ไม่พบ Sheet Ageing ที่รองรับ — ต้องมี IMEI + Entry_Date หรือ IMEI + Status + When หรือ IMEI + WH Received Date');
          }
        }`,
      'Excel sheet auto-detection'
    );

    // ---- 3) Merge Withdraw ลง record: ทุก Withdraw ที่มีวันที่ = ปิดรอบ ----
    out = mustReplace(
      out,
`      let asnCount = 0, withdrawSingleCount = 0, withdrawMultiCount = 0;`,
`      let asnCount = 0, withdrawMatchedCount = 0;`,
      'Withdraw counters'
    );

    out = mustReplace(
      out,
`        // 2) ไฟล์ Withdraw -> เบิกครั้งเดียวปิดรอบ, เบิกหลายครั้งเคลียร์ removedDate ให้นับต่อเนื่อง
        withdrawItems.forEach(it=>{
          const rec = getOrInit(it.imei);
          rec.removedDate = it.removedDate; // '' ถ้าเบิกหลายครั้ง, มีค่าถ้าเบิกครั้งเดียว
          if(it.withdrawCount === 1) withdrawSingleCount++; else withdrawMultiCount++;
        });`,
`        // 2) ไฟล์ Withdraw -> เจอ IMEI เดียวกันให้ปิดรอบที่วันที่เบิกครั้งแรก
        withdrawItems.forEach(it=>{
          const rec = getOrInit(it.imei);
          if(it.removedDate){
            // ถ้ามีวันออกเดิมอยู่แล้ว ใช้วันที่ที่เร็วที่สุด
            rec.removedDate = (!rec.removedDate || it.removedDate < rec.removedDate) ? it.removedDate : rec.removedDate;
            withdrawMatchedCount++;
          }
        });`,
      'Withdraw merge logic'
    );

    out = mustReplace(
      out,
`        ? \` — ASN: \${asnCount} เครื่อง, เบิกครั้งเดียว(ปิดรอบ): \${withdrawSingleCount} เครื่อง, เบิกหลายครั้ง(นับต่อเนื่อง): \${withdrawMultiCount} เครื่อง\``,
`        ? \` — ASN: \${asnCount} เครื่อง, IMEI ที่พบใน Withdraw และปิดรอบ: \${withdrawMatchedCount} เครื่อง\``,
      'Ageing import summary'
    );

    // ---- 4) Volume/เดือน autosave ลง Supabase ----
    out = mustReplace(
      out,
`  document.querySelectorAll('[data-rc-volume]').forEach(el=>{
    el.onchange = async ()=>{
      const act = state.activities.find(a=>a.id===el.dataset.rcVolume);
      if(!act) return;
      act.monthlyVolume = Number(el.value)||0;
      try{
        await sbw(sb.from('activities').update(activityToRow(act)).eq('id', act.id));
        render(); showToast('อัปเดต Volume แล้ว');
      }catch(e){ console.error(e); showToast(\`บันทึกไม่สำเร็จ: \${e && e.message ? e.message : 'ลองใหม่อีกครั้ง'}\`); }
    };
  });`,
`  const volumeSaveTimers = {};
  document.querySelectorAll('[data-rc-volume]').forEach(el=>{
    const saveVolume = async (rerender=false)=>{
      const act = state.activities.find(a=>a.id===el.dataset.rcVolume);
      if(!act) return;
      const value = Number(el.value)||0;
      act.monthlyVolume = value;
      try{
        await sbw(sb.from('activities').update({ monthly_volume:value }).eq('id', act.id));
        if(rerender) render();
        showToast('บันทึก Volume แล้ว');
      }catch(e){
        console.error(e);
        showToast(\`บันทึก Volume ไม่สำเร็จ: \${e && e.message ? e.message : 'ลองใหม่อีกครั้ง'}\`);
      }
    };
    el.oninput = ()=>{
      const act = state.activities.find(a=>a.id===el.dataset.rcVolume);
      if(act) act.monthlyVolume = Number(el.value)||0;
      clearTimeout(volumeSaveTimers[el.dataset.rcVolume]);
      volumeSaveTimers[el.dataset.rcVolume] = setTimeout(()=>saveVolume(false), 500);
    };
    el.onchange = ()=>saveVolume(true);
    el.onblur = ()=>saveVolume(true);
  });`,
      'Volume autosave'
    );

    // ---- 5) ย้ายปุ่มลบข้อมูลทั้งหมดมาไว้ข้างปุ่มเพิ่ม IMEI ----
    out = mustReplace(
      out,
`          <div class="row" style="margin-top:8px">
            <button class="add-item-records-btn" data-activity-for-item="\${a.id}">เพิ่มรายการ IMEI</button>
          </div>
          <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center">
            <div class="hint" style="margin:0">รายการที่บันทึกไว้ (\${recordCount} รายการ, \${count} ชิ้น)</div>
            \${recordCount > 0 ? \`<button class="danger ghost delete-all-items-btn" data-activity-for-item="\${a.id}">🗑️ ลบทั้งหมด (\${recordCount} รายการ)</button>\` : ''}
          </div>`,
`          <div class="row" style="margin-top:8px">
            <button class="add-item-records-btn" data-activity-for-item="\${a.id}">เพิ่มรายการ IMEI</button>
            \${recordCount > 0 ? \`<button class="danger ghost delete-all-items-btn" data-activity-for-item="\${a.id}">🗑️ ลบข้อมูลทั้งหมด (\${recordCount} รายการ)</button>\` : ''}
          </div>
          <div class="row" style="margin-top:16px;justify-content:space-between;align-items:center">
            <div class="hint" style="margin:0">รายการที่บันทึกไว้ (\${recordCount} รายการ, \${count} ชิ้น)</div>
          </div>`,
      'IMEI delete-all button position'
    );

    // ---- 6) ข้อความอธิบายบนหน้าเว็บให้ตรงกับ business rule ใหม่ ----
    out = out.split('(เบิกครั้งเดียว = ปิดรอบ, เบิกหลายครั้ง = นับต่อเนื่องถึงวันนี้ อัตโนมัติ)')
             .join('(พบ IMEI เดียวกันใน Withdraw = หยุด Ageing ที่วันที่เบิกครั้งแรกทันที)');
    out = out.split('เบิกออกแค่ครั้งเดียวในไฟล์นี้ -> ถือว่าปิดรอบ ตั้ง removedDate = วันที่นั้น (หยุดนับ)')
             .join('พบการเบิกออกของ IMEI นี้ -> ถือว่าปิดรอบที่วันที่เบิกครั้งแรก (หยุดนับ)');
    out = out.split('เบิกออก 2 ครั้งขึ้นไป (ออก-กลับ-ออกซ้ำ) -> ยังไม่ปิดรอบ เคลียร์ removedDate ให้ว่าง (นับต่อเนื่องถึงวันนี้)')
             .join('ถ้ามีการเบิกซ้ำหลายครั้ง ระบบยังใช้วันที่เบิกครั้งแรกเป็นวันหยุด Ageing');

    // marker ตรวจว่า production โหลด build นี้จริง
    out = out.replace('<head>', '<head>\\n<!-- SWOP_MART_GITHUB_READY_2026-08-31 -->');

    return out;
  }

  try{
    const res = await fetch(BASE_URL, {cache:'no-store'});
    if(!res.ok) throw new Error('โหลดฐาน index.html ไม่สำเร็จ HTTP ' + res.status);
    const src = await res.text();
    const patched = patchApp(src);

    // เปิดเอกสารใหม่ด้วยแอปตัวเต็มที่ patch แล้ว
    document.open();
    document.write(patched);
    document.close();
  }catch(err){
    console.error(err);
    document.getElementById('err').textContent =
      'โหลดระบบไม่สำเร็จ\\n' +
      (err && err.message ? err.message : String(err)) +
      '\\n\\nตรวจสอบอินเทอร์เน็ต แล้วกด Ctrl+F5 อีกครั้ง';
  }
})();
</script>
</body>
</html>
